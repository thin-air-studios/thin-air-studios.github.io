name: Airport maps

# The map robot (tools/maps/fetch.mjs): fetches airport maps from OpenStreetMap's public Overpass servers into osm/, in
# the queue's order (tools/maps/queue.txt), and commits what it got to main. Back to back: a run that used its time while
# the servers were answering starts the next one as it ends, at the same polite pace (fetch.mjs). After failures, the size
# limit or an empty queue the chain stops, and the 3-hourly schedule starts it again. The queue of about 6,500 airports takes
# weeks. One run at a time: a run never overlaps the next. The bulk builder (maps-bulk.yml) adds maps to main too: publish.mjs
# keeps a map that main already has, so a clash between the two loses nothing, and a failed commit still starts the next run.

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to start the next run

concurrency:
  group: airport-maps
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      # main as it is when the run starts: a run that waited behind another would otherwise check out the commit it was queued
      # at, fetch the maps that run already committed, and clash with it on failures.json
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch maps (about 100 minutes, then the run ends)
        id: fetch
        run: node tools/maps/fetch.mjs
        env:
          BUDGET_MIN: 100
      - name: Commit the maps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # this run's new maps and its failures list go to a stage; publish.mjs puts them on main from the newest main
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE/osm" "$STAGE/tools/maps"
          git ls-files --others --exclude-standard osm | while read -r f; do mv "$f" "$STAGE/osm/"; done
          cp tools/maps/failures.json "$STAGE/tools/maps/failures.json"
          node tools/maps/publish.mjs --stage="$STAGE" --message="Airport maps: {n} new from OpenStreetMap"
      # also after a failed commit: the next run fetches what is on main, so the chain need not wait for the schedule
      - name: Start the next run
        if: always() && steps.fetch.outputs.next == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run maps.yml --ref main
