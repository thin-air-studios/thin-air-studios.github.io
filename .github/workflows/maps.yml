name: Airport maps

# The map robot (tools/maps/fetch.mjs): fetches airport maps from OpenStreetMap's public Overpass servers into osm/, in
# the queue's order (tools/maps/queue.txt), and commits what it got to main. Back to back: a run that used its time while
# the servers were answering starts the next one as it ends, at the same polite pace (fetch.mjs). After failures, the size
# limit or an empty queue the chain stops, and the 3-hourly schedule starts it again. The queue of about 6,500 airports takes
# weeks. One run at a time: a run never overlaps the next.

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to start the next run

concurrency:
  group: airport-maps
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      # main as it is when the run starts: a run that waited behind another would otherwise check out the commit it was queued
      # at, fetch the maps that run already committed, and clash with it on failures.json
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch maps (about 100 minutes, then the run ends)
        id: fetch
        run: node tools/maps/fetch.mjs
        env:
          BUDGET_MIN: 100
      - name: Commit the maps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add osm tools/maps/failures.json
          if git diff --cached --quiet; then echo "no new maps this run"; exit 0; fi
          git commit -m "Airport maps: $(git diff --cached --name-only | wc -l) new from OpenStreetMap"
          for i in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              # a clash on the failures list keeps this run's list (the newer one); any other clash stops the rebase
              git checkout --theirs tools/maps/failures.json && git add tools/maps/failures.json \
                && GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            git push origin HEAD:main && break
            sleep $((i * 10))
          done
      - name: Start the next run
        if: steps.fetch.outputs.next == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run maps.yml --ref main
